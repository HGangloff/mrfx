[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["mrfx"]

[tool.setuptools_scm]
[project]
name = "mrfx"
dynamic = ["version"]
description = "Markov Random Fields with JAX"
readme = "README.md"
license = {text = "Apache License 2.0"}
requires-python = ">=3.11"
keywords = []
authors = [
  {name = "Hugo Gangloff", email = "hugo.gangloff@inrae.fr"},
]
maintainers = [
  {name = "Hugo Gangloff", email = "hugo.gangloff@inrae.fr"},
]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
]
dependencies = [
    "numpy",
    "jax",
    "equinox",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
]

[project.optional-dependencies]
notebook = ["jupyter", "seaborn", "pandas", "diffrax"]
gpu_cuda13 = ["jax[cuda13]>=0.8.1"]
gpu_cuda12 = ["jax[cuda12]>=0.8.1"]
cpu = ["jax>=0.8.1"]

[project.urls]
homepage = "https://github.com/HGangloff/mrfx"
repository = "https://github.com/HGangloff/mrfx"

[tool.ruff]
[tool.ruff.lint]
ignore = ["F722", "E741", "E731"]
